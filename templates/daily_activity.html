<!DOCTYPE html>
<html>
<head>
    <title>Daily Activity Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h3 class="mb-4 text-center text-primary">Daily Activity Tracker</h3>

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Dynatrace Tenant URL</label>
            <input type="text" name="tenant_url" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Access Token</label>
            <input type="password" name="access_token" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Time Frame</label>
            <select name="timeframe" class="form-select">
                <option value="1h">Last 1 Hour</option>
                <option value="1d">Last 1 Day</option>
                <option value="1w">Last 1 Week</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Download Report</button>
    </form>

    {% if message %}
    <div class="alert alert-info mt-3">{{ message }}</div>
    {% endif %}

    <div class="text-center mt-4">
        <a href="/" class="btn btn-outline-secondary">Back to Home</a>
    </div>
</div>
</body>
</html>
